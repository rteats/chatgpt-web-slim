name: Live reader checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test live/api-tests.mjs live/protocol-tests.mjs live/diagnostics-tests.mjs live/account-capture-tests.mjs live/site-probe-tests.mjs live/net-audit-tests.mjs
      - run: node --check live/app.mjs
      - run: node --check live/api.mjs
      - run: node --check live/model.mjs
      - run: node --check live/stream.mjs
      - run: node --check live/send-model.mjs
      - run: node --check live/diagnostics.mjs
      - run: node --check live/background.js
      - run: node --check live/account-capture.mjs
      - run: node --check live/site-probe.mjs
      - run: node --check live/net-panel.mjs
      - run: node --check live/net-audit.mjs
